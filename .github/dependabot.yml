version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-depedencies:
        patterns: '*'
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv-depedencies:
        patterns: '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-depedencies:
        patterns: '*'
